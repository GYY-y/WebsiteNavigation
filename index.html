<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简文件树书签导航</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Fira Code & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    },
                    colors: {
                        tree: {
                            bg: '#1e1e1e',
                            sidebar: '#252526',
                            hover: '#2a2d2e',
                            active: '#37373d',
                            border: '#333333',
                            line: '#404040'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.5);
        }

        /* Tree Guide Line */
        .tree-children {
            position: relative;
            margin-left: 1rem;
            padding-left: 0.5rem;
        }
        .tree-children::before {
            content: '';
            position: absolute;
            left: 0.25rem;
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: rgba(156, 163, 175, 0.2);
        }
        .dark .tree-children::before {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .highlight-text {
            background-color: rgba(234, 179, 8, 0.3);
            color: #facc15;
            padding: 0 2px;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-800 dark:text-gray-200 font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <header class="h-12 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 px-4 flex items-center justify-between shrink-0 select-none">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-folder-tree text-blue-500 text-lg"></i>
            <span class="font-mono font-bold text-sm tracking-wide text-gray-800 dark:text-gray-100">BOOKMARKS_TREE.v1</span>
            <span class="hidden sm:inline-block text-xs text-gray-400 border border-gray-200 dark:border-gray-700 rounded px-1.5 py-0.5 font-mono">层级目录导航</span>
        </div>

        <div class="flex items-center gap-2">
            <button id="expandAllBtn" class="px-2.5 py-1 text-xs font-mono bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 rounded transition flex items-center gap-1.5" title="全部展开">
                <i class="fa-solid fa-angles-down text-[10px]"></i> 展开全部
            </button>
            <button id="collapseAllBtn" class="px-2.5 py-1 text-xs font-mono bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 rounded transition flex items-center gap-1.5" title="全部折叠">
                <i class="fa-solid fa-angles-up text-[10px]"></i> 折叠全部
            </button>
            <div class="h-4 w-px bg-gray-300 dark:bg-gray-700 mx-1"></div>
            <button id="addNodeBtn" class="p-1.5 text-xs text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-950/40 rounded transition" title="新建节点/书签">
                <i class="fa-solid fa-plus text-sm"></i>
            </button>
            <button id="ioModalBtn" class="p-1.5 text-xs text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded transition" title="导入/导出">
                <i class="fa-solid fa-file-import text-sm"></i>
            </button>
            <button id="themeToggleBtn" class="p-1.5 text-xs text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded transition" title="切换主题">
                <i class="fa-solid fa-moon text-sm dark:hidden"></i>
                <i class="fa-solid fa-sun text-sm hidden dark:inline text-amber-400"></i>
            </button>
        </div>
    </header>

    <div class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 p-2 px-4 flex items-center gap-3">
        <div class="relative flex-1 max-w-xl">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
            <input type="text" id="searchInput" placeholder="搜索目录/书签（输入关键字实时展开并高亮）..." 
                class="w-full pl-8 pr-8 py-1.5 bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-gray-700 rounded text-xs font-mono focus:outline-none focus:border-blue-500 dark:focus:border-blue-500 text-gray-800 dark:text-gray-200">
            <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="searchCounter" class="text-xs font-mono text-gray-400 hidden sm:block">
            包含多层级目录
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden">
        
        <!-- Left Pane: File Tree Navigator -->
        <aside class="w-full md:w-80 lg:w-96 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col shrink-0 select-none">
            <div class="px-3 py-2 bg-gray-50 dark:bg-gray-800/50 border-b border-gray-200 dark:border-gray-800 text-[11px] font-mono uppercase tracking-wider text-gray-500 dark:text-gray-400 flex items-center justify-between">
                <span><i class="fa-regular fa-folder-closed mr-1"></i> 目录视图 (Tree)</span>
                <span id="nodeStats" class="text-[10px] text-gray-400">0 项</span>
            </div>
            
            <div id="treeContainer" class="flex-1 overflow-y-auto p-2 font-mono text-xs space-y-0.5">
                <!-- Tree Content Rendered via JS -->
            </div>
        </aside>

        <!-- Right Pane: Detail & Direct View -->
        <main class="hidden md:flex flex-1 flex-col bg-gray-50 dark:bg-gray-950 overflow-hidden">
            <!-- Breadcrumb Navigation Bar -->
            <div id="breadcrumbBar" class="h-9 px-4 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 flex items-center gap-2 text-xs font-mono text-gray-500 dark:text-gray-400 shrink-0">
                <i class="fa-solid fa-compass text-blue-500"></i>
                <span id="breadcrumbPath">根目录</span>
            </div>

            <!-- Content Details Card View -->
            <div id="detailView" class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- Content generated dynamically -->
            </div>
        </main>
    </div>

    <!-- Add Node Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-lg max-w-md w-full p-5 shadow-2xl border border-gray-200 dark:border-gray-800 font-sans">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100 dark:border-gray-800">
                <h3 class="text-sm font-bold font-mono text-gray-800 dark:text-gray-100">新增节点 (文件夹 / 书签)</h3>
                <button class="closeModalBtn text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="addNodeForm" class="space-y-3 font-mono text-xs">
                <div>
                    <label class="block text-gray-500 dark:text-gray-400 mb-1">节点类型</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="nodeType" value="bookmark" checked class="text-blue-600">
                            <span>书签 (Bookmark)</span>
                        </label>
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="radio" name="nodeType" value="folder" class="text-blue-600">
                            <span>文件夹 (Folder)</span>
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-gray-500 dark:text-gray-400 mb-1">选择父文件夹</label>
                    <select id="parentSelect" class="w-full px-2.5 py-1.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded text-gray-800 dark:text-gray-200 focus:outline-none">
                        <!-- Dynamic Options -->
                    </select>
                </div>
                <div>
                    <label class="block text-gray-500 dark:text-gray-400 mb-1">名称</label>
                    <input type="text" id="nodeName" required placeholder="如: GitHub" class="w-full px-2.5 py-1.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded text-gray-800 dark:text-gray-200 focus:outline-none">
                </div>
                <div id="urlField">
                    <label class="block text-gray-500 dark:text-gray-400 mb-1">网址 URL</label>
                    <input type="url" id="nodeUrl" placeholder="https://example.com" class="w-full px-2.5 py-1.5 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded text-gray-800 dark:text-gray-200 focus:outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" class="closeModalBtn px-3 py-1.5 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded">取消</button>
                    <button type="submit" class="px-3 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded shadow-sm">保存节点</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Import/Export Modal -->
    <div id="ioModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-lg max-w-md w-full p-5 shadow-2xl border border-gray-200 dark:border-gray-800 font-sans">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-100 dark:border-gray-800">
                <h3 class="text-sm font-bold font-mono text-gray-800 dark:text-gray-100">配置备份与导入</h3>
                <button class="closeIOModalBtn text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-3 font-mono text-xs">
                <button id="exportJsonBtn" class="w-full py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> 导出 JSON 配置文件
                </button>
                <input type="file" id="importFileInput" accept=".json" class="hidden">
                <button id="triggerImportBtn" class="w-full py-2 bg-blue-50 dark:bg-blue-950/40 hover:bg-blue-100 text-blue-600 dark:text-blue-400 rounded flex items-center justify-center gap-2">
                    <i class="fa-solid fa-upload"></i> 选择 JSON 导入
                </button>
                <div class="pt-2 border-t border-gray-100 dark:border-gray-800">
                    <button id="resetDataBtn" class="w-full py-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/20 rounded">重置为内置初始目录树</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-900 text-white dark:bg-gray-100 dark:text-gray-900 px-3 py-1.5 rounded text-xs font-mono shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50">
        已复制链接到剪贴板
    </div>

    <script src="bookmarks-data.js"></script>
    <script>
        // Bookmark data is kept in bookmarks-data.js to keep this HTML lightweight.
        let treeData = JSON.parse(localStorage.getItem('resource_bookmarks_data_v1')) || defaultTreeData;
        // Keep the small manual archive edits in sync with copies saved in localStorage.
        (function syncClubBlog(){
            let club = findNodeByName(treeData, '知享俱乐部网站');
            if (!club || !club.children) return;
            club.children = club.children.filter(node => node.url !== 'https://www.158wang.hn.cn/' && node.url !== 'https://yueqian.158wang.hn.cn/');
            if (!club.children.some(node => node.url === 'https://916575.xyz')) {
                club.children.splice(1, 0, { id: 'club-blog-coconut', name: '椰子博客', type: 'bookmark', url: 'https://916575.xyz' });
            }
            localStorage.setItem('resource_bookmarks_data_v1', JSON.stringify(treeData));
        })();
        let selectedFolderId = null;
        let currentSearchQuery = '';

        // DOM Elements
        const treeContainer = document.getElementById('treeContainer');
        const detailView = document.getElementById('detailView');
        const breadcrumbPath = document.getElementById('breadcrumbPath');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const nodeStats = document.getElementById('nodeStats');

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderTree();
            renderDetailView();
            updateStats();
            bindEvents();
        });

        function initTheme() {
            const isDark = localStorage.getItem('theme') === 'dark' || 
                (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        function renderTree() {
            treeContainer.innerHTML = renderTreeNodes(treeData, currentSearchQuery.toLowerCase().trim());
        }

        function renderTreeNodes(nodes, query = '') {
            if (!nodes || nodes.length === 0) return '';

            let html = '';
            nodes.forEach(node => {
                const isFolder = node.type === 'folder';
                const hasChildren = isFolder && node.children && node.children.length > 0;
                
                // Search Filter Matching Logic
                let isMatched = false;
                if (query) {
                    const matchSelf = node.name.toLowerCase().includes(query) || (!isFolder && node.url && node.url.toLowerCase().includes(query));
                    const matchChildren = isFolder && hasChildMatch(node, query);
                    isMatched = matchSelf || matchChildren;

                    // Auto expand if children match query
                    if (matchChildren && isFolder) {
                        node.expanded = true;
                    }
                } else {
                    isMatched = true;
                }

                if (!isMatched && query) return;

                const displayName = highlightQuery(node.name, query);

                if (isFolder) {
                    const isExpanded = node.expanded;
                    const isSelected = selectedFolderId === node.id;
                    
                    html += `
                        <div class="tree-node-group">
                            <div onclick="selectFolder('${node.id}', event)" 
                                 class="flex items-center gap-1.5 py-1 px-1.5 rounded cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-800/80 transition-colors ${isSelected ? 'bg-blue-50 dark:bg-gray-800 text-blue-600 dark:text-blue-400 font-semibold' : 'text-gray-700 dark:text-gray-300'}">
                                
                                <button onclick="toggleExpand('${node.id}', event)" class="w-4 h-4 flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                                    <i class="fa-solid fa-chevron-right text-[10px] transition-transform ${isExpanded ? 'rotate-90' : ''}"></i>
                                </button>
                                
                                <i class="fa-solid ${isExpanded ? 'fa-folder-open text-amber-500' : 'fa-folder text-amber-500'} text-xs"></i>
                                
                                <span class="truncate flex-1">${displayName}</span>
                                <span class="text-[10px] text-gray-400 opacity-60 font-mono">${node.children ? node.children.length : 0}</span>
                            </div>
                            
                            ${isExpanded && hasChildren ? `
                                <div class="tree-children">
                                    ${renderTreeNodes(node.children, query)}
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    // Bookmark Node
                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(node.url)}&sz=32`;
                    html += `
                        <div class="tree-node-item flex items-center gap-1.5 py-1 px-1.5 pl-5 rounded hover:bg-gray-100 dark:hover:bg-gray-800/80 transition-colors group text-gray-600 dark:text-gray-400">
                            <img src="${faviconUrl}" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>'" class="w-3.5 h-3.5 object-contain shrink-0" alt="">
                            <a href="${node.url}" target="_blank" class="truncate flex-1 hover:text-blue-500 dark:hover:text-blue-400">${displayName}</a>
                            <button onclick="copyUrl('${node.url}', event)" class="opacity-0 group-hover:opacity-100 p-0.5 text-[10px] text-gray-400 hover:text-blue-500 transition" title="复制链接">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    `;
                }
            });

            return html;
        }

        // Helper: Check if child match query recursively
        function hasChildMatch(node, query) {
            if (!node.children) return false;
            return node.children.some(child => {
                const selfMatch = child.name.toLowerCase().includes(query) || (child.type === 'bookmark' && child.url && child.url.toLowerCase().includes(query));
                if (selfMatch) return true;
                if (child.type === 'folder') return hasChildMatch(child, query);
                return false;
            });
        }

        // Helper: Highlight query in text
        function highlightQuery(text, query) {
            if (!query) return text;
            const idx = text.toLowerCase().indexOf(query);
            if (idx === -1) return text;
            const before = text.substring(0, idx);
            const match = text.substring(idx, idx + query.length);
            const after = text.substring(idx + query.length);
            return `${before}<span class="highlight-text">${match}</span>${after}`;
        }

        function toggleExpand(id, event) {
            if (event) event.stopPropagation();
            const node = findNodeById(treeData, id);
            if (node) {
                node.expanded = !node.expanded;
                renderTree();
            }
        }

        function selectFolder(id, event) {
            if (event) event.stopPropagation();
            selectedFolderId = id;
            renderTree();
            renderDetailView();
        }

        function setAllExpanded(nodes, state) {
            nodes.forEach(node => {
                if (node.type === 'folder') {
                    node.expanded = state;
                    if (node.children) setAllExpanded(node.children, state);
                }
            });
        }

        document.getElementById('expandAllBtn').addEventListener('click', () => {
            setAllExpanded(treeData, true);
            renderTree();
        });

        document.getElementById('collapseAllBtn').addEventListener('click', () => {
            setAllExpanded(treeData, false);
            renderTree();
        });

        function renderDetailView() {
            let targetNode = selectedFolderId ? findNodeById(treeData, selectedFolderId) : null;
            
            if (!targetNode) {
                breadcrumbPath.innerHTML = '所有书签 (根目录)';
                renderFolderGrid(treeData);
            } else {
                const pathArray = getNodePath(treeData, selectedFolderId);
                breadcrumbPath.innerHTML = pathArray.map((p, index) => 
                    `<span class="hover:text-blue-500 cursor-pointer" onclick="selectFolder('${p.id}')">${p.name}</span>`
                ).join(' <i class="fa-solid fa-chevron-right text-[9px] mx-1 text-gray-400"></i> ');

                renderFolderGrid(targetNode.children || []);
            }
        }

        function renderFolderGrid(items) {
            if (!items || items.length === 0) {
                detailView.innerHTML = `
                    <div class="h-64 flex flex-col items-center justify-center text-gray-400 font-mono text-xs border border-dashed border-gray-200 dark:border-gray-800 rounded-lg">
                        <i class="fa-regular fa-folder-open text-3xl mb-2 text-gray-300 dark:text-gray-700"></i>
                        <span>该目录下暂无子项</span>
                    </div>
                `;
                return;
            }

            // Separate Folders and Bookmarks
            const folders = items.filter(i => i.type === 'folder');
            const bookmarks = items.filter(i => i.type === 'bookmark');

            let html = '';

            if (folders.length > 0) {
                html += `
                    <div>
                        <div class="text-xs font-mono text-gray-400 mb-3 flex items-center gap-1.5 uppercase tracking-wider">
                            <i class="fa-solid fa-folder text-amber-500"></i> 子文件夹 (${folders.length})
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${folders.map(f => `
                                <div onclick="selectFolder('${f.id}')" class="p-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg shadow-sm hover:border-blue-500 dark:hover:border-blue-500/50 cursor-pointer transition flex items-center gap-3 group">
                                    <i class="fa-solid fa-folder text-amber-500 text-lg group-hover:scale-110 transition-transform"></i>
                                    <div class="min-w-0 flex-1">
                                        <div class="font-mono text-xs font-semibold text-gray-800 dark:text-gray-200 truncate">${f.name}</div>
                                        <div class="text-[10px] text-gray-400 font-mono">${f.children ? f.children.length : 0} 项</div>
                                    </div>
                                    <i class="fa-solid fa-arrow-right text-xs text-gray-300 dark:text-gray-700 group-hover:text-blue-500 transition-colors"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (bookmarks.length > 0) {
                html += `
                    <div>
                        <div class="text-xs font-mono text-gray-400 mb-3 flex items-center gap-1.5 uppercase tracking-wider">
                            <i class="fa-solid fa-bookmark text-blue-500"></i> 书签 (${bookmarks.length})
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${bookmarks.map(b => {
                                const faviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(b.url)}&sz=64`;
                                return `
                                    <a href="${b.url}" target="_blank" class="p-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-lg shadow-sm hover:border-blue-500 dark:hover:border-blue-500/50 hover:shadow-md transition flex items-center gap-3 group">
                                        <img src="${faviconUrl}" onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>'" class="w-6 h-6 object-contain shrink-0 group-hover:scale-105 transition-transform" alt="">
                                        <div class="min-w-0 flex-1">
                                            <div class="font-mono text-xs font-medium text-gray-800 dark:text-gray-200 truncate group-hover:text-blue-500 transition-colors">${b.name}</div>
                                            <div class="text-[10px] text-gray-400 font-mono truncate mt-0.5">${b.url.replace(/^https?:\/\//, '')}</div>
                                        </div>
                                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-gray-300 dark:text-gray-700 group-hover:text-blue-500 opacity-0 group-hover:opacity-100 transition"></i>
                                    </a>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            detailView.innerHTML = html;
        }

        searchInput.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            if (currentSearchQuery) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderTree();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentSearchQuery = '';
            clearSearchBtn.classList.add('hidden');
            renderTree();
        });

        function findNodeById(nodes, id) {
            for (let node of nodes) {
                if (node.id === id) return node;
                if (node.children) {
                    let found = findNodeById(node.children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        function findNodeByName(nodes, name) {
            for (const node of nodes) {
                if (node.name === name) return node;
                if (node.children) {
                    const found = findNodeByName(node.children, name);
                    if (found) return found;
                }
            }
            return null;
        }

        function getNodePath(nodes, id, currentPath = []) {
            for (let node of nodes) {
                if (node.id === id) return [...currentPath, node];
                if (node.children) {
                    let path = getNodePath(node.children, id, [...currentPath, node]);
                    if (path) return path;
                }
            }
            return null;
        }

        function countStats(nodes) {
            let folders = 0;
            let bookmarks = 0;

            function recurse(list) {
                list.forEach(n => {
                    if (n.type === 'folder') {
                        folders++;
                        if (n.children) recurse(n.children);
                    } else {
                        bookmarks++;
                    }
                });
            }
            recurse(nodes);
            return { folders, bookmarks };
        }

        function updateStats() {
            const stats = countStats(treeData);
            nodeStats.innerText = `${stats.folders} 文件夹, ${stats.bookmarks} 书签`;
        }

        function copyUrl(url, event) {
            event.stopPropagation();
            event.preventDefault();
            navigator.clipboard.writeText(url).then(() => {
                showToast('已成功复制链接到剪贴板');
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function bindEvents() {
            // Add Modal Toggle
            const addModal = document.getElementById('addModal');
            document.getElementById('addNodeBtn').addEventListener('click', () => {
                populateParentSelect();
                addModal.classList.remove('hidden');
            });
            document.querySelectorAll('.closeModalBtn').forEach(b => {
                b.addEventListener('click', () => addModal.classList.add('hidden'));
            });

            // Handle Add Form Submission
            document.getElementById('addNodeForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const type = document.querySelector('input[name="nodeType"]:checked').value;
                const parentId = document.getElementById('parentSelect').value;
                const name = document.getElementById('nodeName').value.trim();
                const url = document.getElementById('nodeUrl').value.trim();

                const newNode = {
                    id: 'node-' + Date.now(),
                    name: name,
                    type: type
                };

                if (type === 'folder') {
                    newNode.children = [];
                    newNode.expanded = true;
                } else {
                    newNode.url = url || 'https://example.com';
                }

                if (parentId === 'root') {
                    treeData.push(newNode);
                } else {
                    const parentNode = findNodeById(treeData, parentId);
                    if (parentNode && parentNode.children) {
                        parentNode.children.push(newNode);
                        parentNode.expanded = true;
                    }
                }

                saveAndRefresh();
                addModal.classList.add('hidden');
                document.getElementById('addNodeForm').reset();
            });

            // Backup & Import
            const ioModal = document.getElementById('ioModal');
            document.getElementById('ioModalBtn').addEventListener('click', () => {
                ioModal.classList.remove('hidden');
            });
            document.querySelectorAll('.closeIOModalBtn').forEach(b => {
                b.addEventListener('click', () => ioModal.classList.add('hidden'));
            });

            document.getElementById('exportJsonBtn').addEventListener('click', () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(treeData, null, 2));
                const a = document.createElement('a');
                a.href = dataStr;
                a.download = `tree_bookmarks_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            });

            const importFileInput = document.getElementById('importFileInput');
            document.getElementById('triggerImportBtn').addEventListener('click', () => importFileInput.click());

            importFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (Array.isArray(parsed)) {
                            treeData = parsed;
                            saveAndRefresh();
                            ioModal.classList.add('hidden');
                            showToast('导入文件成功');
                        }
                    } catch (err) {
                        alert('格式解析错误！');
                    }
                };
                reader.readAsText(file);
            });

            document.getElementById('resetDataBtn').addEventListener('click', () => {
                if (confirm('确认还原为系统初始示例树状目录？')) {
                    localStorage.removeItem('tree_bookmarks_data');
                    treeData = defaultTreeData;
                    saveAndRefresh();
                    ioModal.classList.add('hidden');
                }
            });
        }

        function populateParentSelect() {
            const select = document.getElementById('parentSelect');
            let options = `<option value="root">/ (根目录)</option>`;

            function recurseFolders(nodes, depth = 0) {
                nodes.forEach(n => {
                    if (n.type === 'folder') {
                        const prefix = '&nbsp;&nbsp;'.repeat(depth) + '└─ ';
                        options += `<option value="${n.id}">${prefix}${n.name}</option>`;
                        if (n.children) recurseFolders(n.children, depth + 1);
                    }
                });
            }

            recurseFolders(treeData);
            select.innerHTML = options;
        }

        function saveAndRefresh() {
                    localStorage.setItem('resource_bookmarks_data_v1', JSON.stringify(treeData));
            renderTree();
            renderDetailView();
            updateStats();
        }
    </script>
</body>
</html>
